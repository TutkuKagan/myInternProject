<div class="form-container">
  <div class="form-card">
    <h2>{{ isEditMode ? 'Edit Task' : 'Create New Task' }}</h2>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" formControlName="title" placeholder="Enter task title" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="4" placeholder="Enter task details"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            <!-- C# Enum değerleri: Low=0, Medium=1, High=2 -->
            <option [ngValue]="0">Low</option>
            <option [ngValue]="1">Medium</option>
            <option [ngValue]="2">High</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" formControlName="status">
            <!-- C# Enum değerleri: Todo=0, InProgress=1, Done=2 -->
            <option [ngValue]="0">Todo</option>
            <option [ngValue]="1">In Progress</option>
            <option [ngValue]="2">Done</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" formControlName="dueDate" />
      </div>

      <div class="form-actions">
        <a routerLink="/tasks" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Task' : 'Create Task') }}
        </button>
      </div>
    </form>
  </div>
</div>
