<div class="detail-container">
  <div class="detail-card" *ngIf="task">
    <h2>{{ task.title }}</h2>
    <p class="description">{{ task.description }}</p>
    
    <div class="actions">
      <a routerLink="/tasks" class="btn btn-secondary">Back to Tasks</a>
      <a [routerLink]="['/tasks/edit', task.id]" class="btn btn-primary">Edit Task</a>
    </div>
  </div>
</div>
