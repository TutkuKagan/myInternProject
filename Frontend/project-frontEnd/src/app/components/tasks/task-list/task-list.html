<div class="task-list-container">
  <div class="list-header">
    <div>
      <h1>My Tasks</h1>
      <p>Manage and organize your current workload</p>
    </div>
    <a routerLink="/tasks/new" class="btn btn-primary">+ Create Task</a>
  </div>

  <div class="filter-bar">
    <div class="search-box">
      <input 
        type="text" 
        placeholder="🔍 Search tasks..." 
        [(ngModel)]="searchTerm" 
        (ngModelChange)="applyFilters()"
      />
    </div>

    <div class="filter-group">
      <label>Status:</label>
      <select [(ngModel)]="statusFilter" (change)="applyFilters()">
        <option value="ALL">All Statuses</option>
        <option value="0">Pending</option>
        <option value="1">In Progress</option>
        <option value="2">Completed</option>
        <option value="3">Cancelled</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Priority:</label>
      <select [(ngModel)]="priorityFilter" (change)="applyFilters()">
        <option value="ALL">All Priorities</option>
        <option value="1">Low</option>
        <option value="2">Normal</option>
        <option value="3">High</option>
        <option value="4">Urgent</option>
        <option value="5">Critical</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Sort By:</label>
      <select [(ngModel)]="sortBy" (change)="applyFilters()">
        <option value="createdAt_desc">Newest First</option>
        <option value="dueDate_asc">Due Date (Earliest)</option>
        <option value="dueDate_desc">Due Date (Latest)</option>
        <option value="priority_desc">Priority (High to Low)</option>
        <option value="priority_asc">Priority (Low to High)</option>
        <option value="title_asc">Title (A-Z)</option>
      </select>
    </div>
  </div>

  <div class="loading-spinner" *ngIf="isLoading">
    Loading tasks...
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="empty-state" *ngIf="!isLoading && paginatedTasks.length === 0">
    <p>No tasks found matching your criteria.</p>
  </div>

  <div class="tasks-grid" *ngIf="!isLoading && paginatedTasks.length > 0">
    <app-task-card 
       *ngFor="let task of paginatedTasks; trackBy: trackByTaskId" 
       [task]="task"
       (deleteRequested)="handleDeleteTask($event)">
</app-task-card>
  </div>

  <div class="pagination-container" *ngIf="!isLoading && totalPages > 1">
    <button 
      class="pagination-btn" 
      [disabled]="currentPage === 1" 
      (click)="goToPage(currentPage - 1)">
      &laquo; Previous
    </button>

    <div class="page-numbers">
      <button 
        *ngFor="let page of totalPagesArray" 
        class="page-num-btn" 
        [class.active]="page === currentPage" 
        (click)="goToPage(page)">
        {{ page }}
      </button>
    </div>

    <button 
      class="pagination-btn" 
      [disabled]="currentPage === totalPages" 
      (click)="goToPage(currentPage + 1)">
      Next &raquo;
    </button>
  </div>
</div>
