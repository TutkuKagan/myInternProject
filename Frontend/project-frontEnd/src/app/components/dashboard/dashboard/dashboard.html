<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Overview of your personal tasks and productivity status</p>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Tasks</h3>
      <p class="stat-number">{{ totalTasks }}</p>
    </div>
    <div class="stat-card">
      <h3>Pending</h3>
      <p class="stat-number warning">{{ pendingTasks }}</p>
    </div>
    <div class="stat-card">
      <h3>In Progress</h3>
      <p class="stat-number info">{{ inProgressTasks }}</p>
    </div>
    <div class="stat-card">
      <h3>Completed</h3>
      <p class="stat-number success">{{ completedTasks }}</p>
    </div>
  </div>

  <div class="actions-section">
    <a routerLink="/tasks/new" class="btn btn-primary">+ Create New Task</a>
    <a routerLink="/tasks" class="btn btn-secondary">View All Tasks</a>
  </div>
</div>
